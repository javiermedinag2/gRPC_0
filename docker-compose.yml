services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$MONGO_INITDB_ROOT_USERNAME" ]; then
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok";
          else
          mongosh --quiet --eval "db.adminCommand('ping').ok";
          fi
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_HOST: mongodb
      GRPC_BIND_ADDRESS: 0.0.0.0:50051
    command: ["python", "servidor/server.py"]
    ports:
      - "50051:50051"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 50051), timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  graphql-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GRPC_SERVER_ADDRESS: grpc-server:50051
      GRAPHQL_HOST: 0.0.0.0
      GRAPHQL_PORT: 8000
    command:
      - python
      - -m
      - uvicorn
      - proxy.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      grpc-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongodb_data:
